<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Pagination & Pager</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- Page Header -->
    <h2 class="text-center fw-bold mb-4">📝 My Blog</h2>
    <p class="text-center text-muted mb-5">Read the latest articles and stories from our team.</p>

    <!-- Blog Posts (example layout) -->
    <div class="row g-4 mb-5">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Post Title 1</h5>
            <p class="card-text text-muted">This is a short excerpt from the first blog post to preview its content...</p>
            <a href="#" class="btn btn-outline-primary btn-sm">Read More</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">Post Title 2</h5>
            <p class="card-text text-muted">Another brief excerpt for the second blog post to show pagination use...</p>
            <a href="#" class="btn btn-outline-primary btn-sm">Read More</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Blog page navigation">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled">
          <a class="page-link">Previous</a>
        </li>
        <li class="page-item active">
          <a class="page-link" href="#">1</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">2</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">Next</a>
        </li>
      </ul>
    </nav>

    <!-- Pager (Older / Newer Posts) -->
    <div class="d-flex justify-content-between mt-5">
      <button class="btn btn-outline-secondary">&larr; Older Posts</button>
      <button class="btn btn-outline-secondary">Newer Posts &rarr;</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
