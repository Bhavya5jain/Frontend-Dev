<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Landing Page</title>
  <!-- ✅ Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- ================= HEADER ================= -->
  <header class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold fs-3" href="#">TechStart</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item mx-2"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ================= HERO SECTION ================= -->
  <section class="bg-light text-center text-dark py-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-6 mx-auto">
          <h1 class="display-4 fw-bold">Welcome to TechStart</h1>
          <p class="lead mt-3">
            We help startups scale faster with innovative technology solutions.
          </p>
          <button class="btn btn-primary btn-lg mt-3">Get Started</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 TechStart. All rights reserved.</p>
  </footer>

  <!-- ✅ Bootstrap JS (for Navbar toggler) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
