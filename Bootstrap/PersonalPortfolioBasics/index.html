<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <!-- ✅ Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light text-dark">

  <!-- ================= HEADER ================= -->
  <header class="text-center p-5 bg-white shadow-sm">
    <h1 class="fw-bold mb-3">Bhavya Jain</h1>
    <p class="lead">Aspiring Software Developer | Java & Spring Boot Enthusiast</p>
  </header>

  <!-- ================= PROFILE SECTION ================= -->
  <section class="container text-center mt-4 mb-3">
    <img
      src="https://via.placeholder.com/180"
      alt="Profile Photo"
      class="img-fluid rounded-circle mb-4"
    />

    <div class="d-flex justify-content-center gap-3">
      <button class="btn btn-primary">Hire Me</button>
      <button class="btn btn-outline-dark">Download CV</button>
    </div>
  </section>

  <!-- ================= CONTACT FORM ================= -->
  <section class="container bg-white p-5 rounded shadow-sm">
    <h2 class="text-center fw-bold mb-4">Contact Me</h2>
    <form>
      <div class="mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Your Name"
          required
        />
      </div>
      <div class="mb-3">
        <input
          type="email"
          class="form-control"
          placeholder="Your Email"
          required
        />
      </div>
      <div class="mb-3">
        <textarea
          class="form-control"
          rows="3"
          placeholder="Your Message"
        ></textarea>
      </div>
      <div class="text-center">
        <button class="btn btn-success px-4">Send Message</button>
      </div>
    </form>
  </section>

  <!-- ================= FOOTER ================= -->
  <footer class="text-center mt-4 py-3 bg-dark text-white">
    <small>© 2025 Bhavya Jain | All Rights Reserved</small>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
