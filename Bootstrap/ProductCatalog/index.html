<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog</title>
  <!-- ✅ Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    /* Smooth hover effect */
    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="bg-light">

  <!-- ================= HEADER ================= -->
  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1 class="fw-bold">GadgetStore</h1>
    <p class="mb-0">Find the best tech deals here!</p>
  </header>

  <!-- ================= PRODUCT GRID ================= -->
  <div class="container">
    <div class="row g-4">
      
      <!-- 🧩 Product 1 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text text-muted">$59.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- 🧩 Product 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Smartwatch</h5>
            <p class="card-text text-muted">$89.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- 🧩 Product 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="card-text text-muted">$39.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- 🧩 Product 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm border-0">
          <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Gaming Mouse</h5>
            <p class="card-text text-muted">$29.99</p>
            <button class="btn btn-primary btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="text-center bg-dark text-white mt-5 py-3">
    <small>© 2025 GadgetStore | All Rights Reserved</small>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
