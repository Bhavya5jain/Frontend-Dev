<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 40px;
    }


    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }


    /* Product Grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }


    /* Product Card */
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }


    .card:hover {
      transform: scale(1.05);
    }


    .product-name {
      font-size: 18px;
      font-weight: bold;
      color: darkblue;
      margin-bottom: 10px;
    }


    .price {
      font-size: 16px;
      color: #555;
    }


    /* Responsive Design */
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }


    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>


  <h1>Product Gallery</h1>


  <div class="gallery">
    <div class="card">
      <div class="product-name">Product 1</div>
      <div class="price">$25.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 2</div>
      <div class="price">$30.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 3</div>
      <div class="price">$45.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 4</div>
      <div class="price">$20.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 5</div>
      <div class="price">$55.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 6</div>
      <div class="price">$35.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 7</div>
      <div class="price">$40.00</div>
    </div>
    <div class="card">
      <div class="product-name">Product 8</div>
      <div class="price">$60.00</div>
    </div>
  </div>


</body>
</html>
