<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: 250px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      background-color: #f0f2f5;
    }


    /* Header */
    header {
      grid-area: header;
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }


    /* Sidebar */
    aside {
      grid-area: sidebar;
      background-color: #1e1e2f;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    aside a {
      text-decoration: none;
      color: white;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }


    aside a:hover {
      background-color: #007bff;
    }


    /* Main Content */
    main {
      grid-area: main;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 200px;
      gap: 20px;
    }


    .box {
      background-color: white;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: #007bff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }


    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }


    /* Box that spans two columns */
    .wide {
      grid-column: span 2;
    }


    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }


      aside {
        flex-direction: row;
        justify-content: space-around;
      }


      main {
        grid-template-columns: 1fr;
      }


      .wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>


  <header>Dashboard</header>


  <aside>
    <a href="#">Overview</a>
    <a href="#">Analytics</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </aside>


  <main>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box wide">Wide Box (Spans 2 Columns)</div>
    <div class="box">Box 4</div>
  </main>


</body>
</html>
