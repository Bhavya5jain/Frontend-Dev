<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 250px;
      height: 350px;
      perspective: 1000px; /* Enables 3D effect */
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }

    .card:hover .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .card-front {
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-front img {
      width: 100%;
      height: 70%;
      object-fit: cover;
    }

    .card-front h2 {
      margin: 10px 0;
    }

    .card-back {
      background-color: #333;
      color: white;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-inner">
      <div class="card-front">
        <img src="https://picsum.photos/id/1025/400/300" alt="Card Image">
        <h2>Golden Retriever</h2>
      </div>
      <div class="card-back">
        <p>The Golden Retriever is known for its friendly and tolerant attitude, making it one of the most popular dog breeds in the world.</p>
      </div>
    </div>
  </div>

</body>
</html>
