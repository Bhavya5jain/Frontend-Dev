<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="css_selectors.css">
</head>
<body>
  <header><h1>Advanced CSS Selectors Showcase</h1></header>

  <main>
    <section>
      <h2>Attribute Selectors</h2>
      <input type="text" placeholder="Type something...">
      <a href="https://example.com">HTTPS Link</a>
      <a href="http://example.com">HTTP Link</a>
    </section>

    <section>
      <h2>List Items with Pseudo-classes</h2>
      <ul class="demo-list">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
      </ul>
    </section>
  </main>
</body>
</html>
