<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>

  <style>
    /* General Page Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      animation: fadeIn 1.5s ease-in;
    }

    h1 {
      color: #0077b6;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    /* Container for Cards */
    .card-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 20px;
      max-width: 1000px;
    }

    /* Individual Card */
    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      width: 280px;
      transition: all 0.3s ease;
      animation: fadeIn 1.5s ease forwards;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      filter: grayscale(100%);
      transition: filter 0.4s ease;
    }

    .card:hover img {
      filter: none;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }

    .card-content {
      padding: 20px;
    }

    .card-content h2 {
      color: #023e8a;
      margin-bottom: 10px;
    }

    .card-content p {
      color: #555;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Fade-in Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Design */
    @media (max-width: 800px) {
      .card-container {
        flex-direction: column;
        align-items: center;
      }

      .card {
        width: 80%;
      }
    }

  </style>
</head>

<body>
  <h1>Team Profiles</h1>

  <div class="card-container">
    <div class="card">
      <img src="https://picsum.photos/id/1005/400/300" alt="Profile 1">
      <div class="card-content">
        <h2>John Smith</h2>
        <p>Frontend Developer passionate about responsive UI design and animation effects.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1011/400/300" alt="Profile 2">
      <div class="card-content">
        <h2>Emily Johnson</h2>
        <p>UI/UX Designer who loves blending creativity and user experience seamlessly.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1012/400/300" alt="Profile 3">
      <div class="card-content">
        <h2>Michael Brown</h2>
        <p>Full-Stack Engineer focused on scalable backend systems and elegant frontends.</p>
      </div>
    </div>
  </div>

</body>
</html>
