<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            color: #00796b;
        }

        /* Comparison Section */
        .comparison {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .image-box {
            position: relative;
            width: 45%;
            text-align: center;
            transition: all 0.5s ease;
        }

        .image-box img {
            width: 100%;
            border-radius: 10px;
            transition: filter 0.5s ease;
        }

        .image-box.filtered img {
            filter: brightness(60%) contrast(120%);
        }

        .image-box.filtered img:hover {
            filter: none;
        }

        .caption {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #444;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .comparison {
                flex-direction: column;
                align-items: center;
            }

            .image-box {
                width: 90%;
            }

            .caption {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <h1>Before & After Filter Comparison</h1>

    <section class="comparison">
        <!-- Original Image -->
        <div class="image-box">
            <img src="https://picsum.photos/id/1015/600/400" alt="Original Image">
            <p class="caption">Original Image</p>
        </div>

        <!-- Filtered Image -->
        <div class="image-box filtered">
            <img src="https://picsum.photos/id/1015/600/400" alt="Filtered Image">
            <p class="caption">Filtered (Brightness + Contrast)</p>
        </div>
    </section>

</body>
</html>
