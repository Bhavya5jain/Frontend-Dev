<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox Layout</title>

  <style>
    /* General Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0077b6;
      color: white;
      padding: 15px 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Main Section */
    main {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      padding: 40px 20px;
      flex-wrap: wrap;
    }

    .feature-box {
      background-color: white;
      flex: 1;
      min-width: 200px;
      max-width: 300px;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-box:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .feature-box h2 {
      color: #0077b6;
      margin-bottom: 10px;
    }

    /* Footer */
    footer {
      text-align: center;
      background-color: #023e8a;
      color: white;
      padding: 15px 0;
      margin-top: 30px;
    }

    /* Responsive Design */
    @media (max-width: 750px) {
      main {
        flex-direction: column;
        align-items: center;
      }

      .feature-box {
        width: 80%;
      }
    }

  </style>
</head>

<body>
  <!-- Header -->
  <header>
    <div class="logo">MyWebsite</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <div class="feature-box">
      <h2>Feature 1</h2>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </div>

    <div class="feature-box">
      <h2>Feature 2</h2>
      <p>Quisque sit amet eros nec justo dignissim tincidunt.</p>
    </div>

    <div class="feature-box">
      <h2>Feature 3</h2>
      <p>Morbi mattis urna non sapien feugiat, sed facilisis elit varius.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 MyWebsite | All Rights Reserved
  </footer>
</body>
</html>
